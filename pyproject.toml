[project]
name = "ai-dev-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.41.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-dev-learning = "ai_dev_learning:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
