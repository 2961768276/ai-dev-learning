name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      # tests/ 为空时不跑 pytest（pytest 无测试会返回 5，导致无意义的红灯）
      - name: Test (pytest)
        run: |
          if compgen -G "tests/test_*.py" > /dev/null; then
            uv run pytest -q
          else
            echo "::notice title=No tests yet::tests/test_*.py 还不存在，跳过 pytest（Day 47 起启用）"
          fi
